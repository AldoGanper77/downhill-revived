name: Build Android 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      

      - name: Fix NDK clang path
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/27.3.13750724
          LINUX_BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          WIN_BIN=$NDK/toolchains/llvm/prebuilt/windows-x86_64/bin
          mkdir -p $WIN_BIN
          for f in clang clang++ clang-cl ld.lld llvm-ar llvm-ranlib; do
            if [ -f "$LINUX_BIN/$f" ]; then cp "$LINUX_BIN/$f" "$WIN_BIN/$f.exe"; fi
            if [ -f "$LINUX_BIN/$f" ] && [ ! -f "$LINUX_BIN/$f.exe" ]; then cp "$LINUX_BIN/$f" "$LINUX_BIN/$f.exe"; fi
          done
          ls $WIN_BIN/clang*
          ls $LINUX_BIN/clang*
          
          
          
          
      - name: Install ninja
        run: pip install ninja
      - name: Build APK
        run: 
          cd port/android
          python3 build_apk.py
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
          GRADLE_USER_HOME: /home/runner/.gradle
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_USER_HOME: /home/runner/.android
     
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
