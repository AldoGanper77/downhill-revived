name: Build Android 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix NDK clang path
        run: |
          NDK_VERSION=27.3.13750724
          NDK_ROOT=/usr/local/lib/android/sdk/ndk/$NDK_VERSION
          echo "NDK_ROOT=$NDK_ROOT"
          ls $NDK_ROOT/toolchains/llvm/prebuilt/
          
          # Bikin folder palsu Windows
          mkdir -p $NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin
          
          # Bikin jalan pintas semua file linux -> .exe windows
          for f in $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/*; do
            base=$(basename "$f")
            ln -sf "$f" "$NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin/$base.exe"
            ln -sf "$f" "$NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin/$base"
          done
          
          ls $NDK_ROOT/toolchains/llvm/prebuilt/windows-x86_64/bin/ | head -20
          
          # Kalau script-nya masih ngeyel, paksa ganti tulisannya
          find . -name "build_host64.py" -exec sed -i 's/windows-x86_64/linux-x86_64/g' {} \;

      - name: Build APK
        run: |
          chmod +x ./build_apk 2>/dev/null || true
          chmod +x ./build*.py 2>/dev/null || true
          ./build_apk --target android-arm64 || python3 build_apk.py --target android-arm64 || python3 build_host64.py --target android-arm64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
