name: Build Android 32-bit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      
      - name: Fix NDK clang path
        run: |
          NDK=${ANDROID_NDK_HOME:-/usr/local/lib/android/sdk/ndk/27.3.13750724}
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1); fi
          echo "NDK=$NDK"
          ln -sfn $NDK/toolchains/llvm/prebuilt/linux-x86_64 $NDK/toolchains/llvm/prebuilt/windows-x86_64
          cd $NDK/toolchains/llvm/prebuilt/windows-x86_64/bin
          for f in *; do [ -f "$f" ] && [ "${f%.exe}" = "$f" ] && ln -sf "$f" "$f.exe"; done
          ls -l *.exe | head -n 20
      
          
          
          
          
      - name: Install ninja
        run: pip install ninja
      - name: Install wabt
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          mkdir -p /home/runner/DevCaches/wabt/wabt-1.0.42/bin
          cp $(which wasm2c) /home/runner/DevCaches/wabt/wabt-1.0.42/bin/wasm2c
          chmod +x /home/runner/DevCaches/wabt/wabt-1.0.42/bin/wasm2c
          ls -l /home/runner/DevCaches/wabt/wabt-1.0.42/bin/wasm2c
          wasm2c --version
      - name: Build APK
        run: |
          cd port/android
          sed -i '/add_argument/!s/--offline//g' build_apk.py || true
          sed -i '/add_argument/!s/--offline//g' ../tools/build_host64.py || true
          sed -i 's/args.offline/False/g' build_apk.py ../tools/build_host64.py || true
          sed -i 's/\.offline/False/g' build_apk.py ../tools/build_host64.py || true
          CARGO_BIN=$(which cargo)
          mkdir -p /tmp/wrap
          printf '#!/bin/bash\nA=(); for X in "$@"; do if [ "$X" != "--offline" ]; then A+=("$X"); fi; done\nexec '"$CARGO_BIN"' "${A[@]}"\n' > /tmp/wrap/cargo
          chmod +x /tmp/wrap/cargo
          export CARGO=/tmp/wrap/cargo
          export CARGO_NET_OFFLINE=false
          sed -i 's/default=True/default=False/g' | ../tools/build_apk.py ../tools/build_host64.py | || || true
          export PATH="/tmp/wrap:$PATH"
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CXX_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          export TARGET_CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          python3 build_apk.py
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
          GRADLE_USER_HOME: /home/runner/.gradle
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_USER_HOME: /home/runner/.android
     
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
